name: Build and Push API Services

on:
  push:
    branches:
      - dev
    paths:
      - 'lucius-severian/api-services/**' # Only trigger if files in the api-services folder change

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-api-services

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required to upload the image to GHCR

    steps:
      # 1. Download the source code from the monorepo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up the Docker build engine
      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      # 3. Log into GitHub Container Registry using the built-in temporary GitHub token
      - name: Log in to the Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Extract metadata (tags, labels) for Docker
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # 5. Build and upload the image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: . # Run from the root context so Docker can see pnpm-workspace files if needed
          file: ./lucius-severian/api-services/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha # Use GitHub Actions caching
          cache-to: type=gha,mode=max

      # 6. Update GitOps configuration repository
      - name: Update GitOps Repository
        env:
          GITOPS_REPO: brijeshpthankachan/gitops-k8s-config
          # Assumes a personal access token is stored in repository secrets
          GH_PAT: ${{ secrets.GITOPS_PAT }}
        run: |
          # Clone the repository
          git clone https://x-access-token:${GH_PAT}@github.com/${GITOPS_REPO}.git gitops-repo
          cd gitops-repo
          
          # Setup git config
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          # Update the deployment.yaml with the new image SHA
          # Extract the short SHA generated by the metadata action
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          
          # Use sed to replace the image tag for the api-services container
          sed -i "s|image: ghcr.io/brijeshpthankachan/lucius-severian-workspace-api-services:.*|image: ghcr.io/brijeshpthankachan/lucius-severian-workspace-api-services:sha-${SHORT_SHA}|g" lucius-severian/dev/deployment.yaml
          
          # Commit and push
          git add lucius-severian/dev/deployment.yaml
          git commit -m "ci: update api-services image tag to sha-${SHORT_SHA}"
          git push
