name: Build and Push Web UI

on:
  push:
    branches:
      - dev
    paths:
      - 'lucius-severian/web-ui/**' # Only trigger if files in the web-ui folder change

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-web-ui

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required to upload the image to GHCR

    steps:
      # 1. Download the source code from the monorepo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up the Docker build engine
      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      # 3. Log into GitHub Container Registry using the built-in temporary GitHub token
      - name: Log in to the Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Extract metadata (tags, labels) for Docker
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # 5. Build and upload the image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: . # Run from the root context so Docker can see pnpm-workspace files
          file: ./lucius-severian/web-ui/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 6. Update GitOps configuration repository
      - name: Update GitOps Repository
        env:
          GITOPS_REPO: brijeshpthankachan/gitops-k8s-config
          GH_PAT: ${{ secrets.GITOPS_PAT }}
        run: |
          # Clone the repository
          git clone https://x-access-token:${GH_PAT}@github.com/${GITOPS_REPO}.git gitops-repo
          cd gitops-repo

          # Setup git config
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # Assign variables cleanly
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          NEW_TAG="sha-${SHORT_SHA}"
          MANIFEST_PATH="lucius-severian/dev/deployment.yaml"

          # Use sed to replace the image tag safely
          sed -i "s|image: ghcr.io/brijeshpthankachan/lucius-severian-workspace-web-ui:.*|image: ghcr.io/brijeshpthankachan/lucius-severian-workspace-web-ui:${NEW_TAG}|g" $MANIFEST_PATH

          # Commit and push
          git add $MANIFEST_PATH
          git commit -m "ci: auto-update web-ui image tag to ${NEW_TAG}"
          git push
