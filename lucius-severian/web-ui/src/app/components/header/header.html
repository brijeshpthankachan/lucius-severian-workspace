<header class="bg-white shadow-sm sticky top-0 z-50">
  <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
    <div class="flex items-center gap-2 cursor-pointer" routerLink="/">
      <div class="w-8 h-8 bg-indigo-600 rounded flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
        </svg>
      </div>
      <span class="text-xl font-bold text-gray-900 tracking-tight">OpenBooks</span>
    </div>

    <div class="flex items-center gap-6">
      <a routerLink="/" class="text-sm font-medium text-gray-700 hover:text-indigo-600 transition-colors">Catalog</a>
      
      <a routerLink="/cart" class="group -m-2 flex items-center p-2">
        <div class="relative">
          <svg class="h-6 w-6 flex-shrink-0 text-gray-400 group-hover:text-gray-500" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007zM8.625 10.5a.375.375 0 11-.75 0 .375.375 0 01.75 0zm7.5 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
          </svg>
          @if (cartService.totalItems() > 0) {
            <span class="absolute -top-1 -right-1 bg-indigo-600 text-white text-[10px] font-bold rounded-full w-4 h-4 flex items-center justify-center ring-2 ring-white">
              {{ cartService.totalItems() }}
            </span>
          }
        </div>
        <span class="ml-2 text-sm font-medium text-gray-700 group-hover:text-gray-800">Cart</span>
      </a>

      <div class="h-6 w-px bg-gray-200" aria-hidden="true"></div>

      @if (authService.isAuthenticated()) {
        <div class="flex items-center gap-3">
          <div class="flex flex-col items-end">
            <span class="text-xs font-semibold text-gray-900 leading-none">{{ authService.user()?.username }}</span>
            <button (click)="logout()" class="text-[10px] text-gray-500 hover:text-red-600 transition-colors font-medium">Sign out</button>
          </div>
          <img [src]="authService.user()?.avatarUrl" class="h-8 w-8 rounded-full border border-gray-200" alt="User avatar">
        </div>
      } @else {
        <a routerLink="/login" class="text-sm font-medium text-indigo-600 hover:text-indigo-500 transition-colors">Sign in</a>
      }
    </div>
  </nav>
</header>
